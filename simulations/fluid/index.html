<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Mechanics - Physics Simulations</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        #canvas { cursor: crosshair; touch-action: none; }
        .controls { flex-wrap: wrap; }
        .info { color: #64748b; font-size: 0.8rem; text-align: center; }
        kbd { background: #334155; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.75rem; }
    </style>
</head>
<body class="sim-page">
    <header>
        <a href="../../index.html" class="back-link">&larr; Back</a>
        <h1>Fluid Mechanics</h1>
    </header>

    <div class="sim-container">
        <canvas id="canvas" width="800" height="500"></canvas>
        <p class="info">Click or drag to create water &middot; Hold <kbd>Shift</kbd>+click to place wall blocks</p>

        <div class="controls">
            <div class="control-group">
                <label>Gravity</label>
                <input type="range" id="gravity" min="0" max="60" value="25" step="1">
                <span id="gravity-val">25</span>
            </div>
            <div class="control-group">
                <label>Stiffness</label>
                <input type="range" id="stiffness" min="50" max="800" value="300" step="10">
                <span id="stiffness-val">300</span>
            </div>
            <div class="control-group">
                <label>Viscosity</label>
                <input type="range" id="viscosity" min="0" max="80" value="20">
                <span id="viscosity-val">20</span>
            </div>
            <div class="control-group">
                <label>Spawn Rate</label>
                <input type="range" id="spawn-rate" min="1" max="12" value="4">
                <span id="spawn-rate-val">4</span>
            </div>
            <button id="reset">Clear All</button>
        </div>
    </div>

    <script>
    (function () {
        // ============================================================
        // Optimized fluid simulation — Double Density Relaxation
        // (Clavet, Beaudoin & Poulin 2005)
        //
        // Optimizations over naive implementation:
        //  - SoA typed arrays (Float64Array) for all particle data
        //  - Fused density + pressure in single grid traversal
        //    with per-particle neighbor cache (temp typed buffers)
        //  - Inline grid traversal (zero closure allocations)
        //  - Single sqrt per neighbor pair (cached via invR)
        //  - Removed redundant second buildGrid() for viscosity
        //  - Pre-computed constants pulled out of inner loops
        //  - Counting-sort color bucketing for batched rendering
        //    (one beginPath+fill per color bucket, not per particle)
        //  - Bitwise |0 for integer grid ops
        // ============================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const CW = canvas.width;
        const CH = canvas.height;
        const TAU = Math.PI * 2;

        // --- Tunable parameters ---
        const H = 25;                    // interaction radius
        const H2 = H * H;               // h squared (pre-computed)
        const INV_H = 1 / H;            // 1/h (pre-computed)
        const REST_DENSITY = 4.0;
        let STIFFNESS = 300;
        const STIFFNESS_NEAR = 800;
        let LINEAR_VISC = 0.20;
        const QUAD_VISC = 0.05;
        let GRAVITY_Y = 25;
        const PARTICLE_R = 4;
        const PARTICLE_R2 = PARTICLE_R * PARTICLE_R;
        const MAX_PARTICLES = 3000;
        let SPAWN_RATE = 4;
        const SUBSTEPS = 3;
        const WALL_BLOCK_SIZE = 20;

        // ==================== SoA Particle Storage ====================
        // Flat typed arrays: zero GC pressure, excellent cache locality
        const posX  = new Float64Array(MAX_PARTICLES);
        const posY  = new Float64Array(MAX_PARTICLES);
        const prevX = new Float64Array(MAX_PARTICLES);
        const prevY = new Float64Array(MAX_PARTICLES);
        const velX  = new Float64Array(MAX_PARTICLES);
        const velY  = new Float64Array(MAX_PARTICLES);
        let N = 0; // active particle count

        // ==================== Walls ====================
        let walls = [];
        let pointerDown = false;
        let pointerX = 0, pointerY = 0;
        let shiftHeld = false;

        // ==================== Spatial Hash ====================
        // Cell size = interaction radius for optimal neighbor queries
        const CELL = H;
        const INV_CELL = 1 / CELL;
        const GRID_COLS = (CW / CELL | 0) + 2;
        const GRID_ROWS = (CH / CELL | 0) + 2;
        const gridHead = new Int32Array(GRID_COLS * GRID_ROWS);
        const gridNext = new Int32Array(MAX_PARTICLES);

        function buildGrid() {
            gridHead.fill(-1);
            for (let i = 0; i < N; i++) {
                const col = (posX[i] * INV_CELL) | 0;
                const row = (posY[i] * INV_CELL) | 0;
                if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) continue;
                const key = row * GRID_COLS + col;
                gridNext[i] = gridHead[key];
                gridHead[key] = i;
            }
        }

        // ==================== Per-Particle Neighbor Cache ====================
        // Avoids double grid traversal in relaxation step:
        // density pass caches neighbors, pressure pass reuses cache
        const MAX_NBRS = 128;
        const nbrIdx = new Uint16Array(MAX_NBRS);
        const nbrNx  = new Float32Array(MAX_NBRS);  // unit direction x
        const nbrNy  = new Float32Array(MAX_NBRS);  // unit direction y
        const nbrW   = new Float32Array(MAX_NBRS);  // kernel weight (1-q)

        // ==================== Color LUT + Render Buffers ====================
        const NUM_COLORS = 24;
        const colorLUT = new Array(NUM_COLORS);
        for (let ci = 0; ci < NUM_COLORS; ci++) {
            const t = ci / (NUM_COLORS - 1);
            let r, g, b;
            if (t < 0.5) {
                const s = t * 2;
                r = (20 + s * 40) | 0;
                g = (80 + s * 140) | 0;
                b = (200 + s * 55) | 0;
            } else {
                const s = (t - 0.5) * 2;
                r = (60 + s * 180) | 0;
                g = (220 + s * 35) | 0;
                b = 255;
            }
            colorLUT[ci] = `rgba(${r},${g},${b},0.85)`;
        }
        // Pre-allocated sorting buffers (zero per-frame allocation)
        const pColor      = new Uint8Array(MAX_PARTICLES);
        const bucketCount = new Uint16Array(NUM_COLORS);
        const bucketStart = new Uint16Array(NUM_COLORS);
        const bucketPos   = new Uint16Array(NUM_COLORS);
        const sortedIdx   = new Uint16Array(MAX_PARTICLES);

        // ==================== Spawning ====================
        function spawnAt(x, y, count) {
            for (let i = 0; i < count; i++) {
                if (N >= MAX_PARTICLES) return;
                const idx = N++;
                posX[idx]  = x + (Math.random() - 0.5) * H * 0.6;
                posY[idx]  = y + (Math.random() - 0.5) * H * 0.6;
                prevX[idx] = posX[idx];
                prevY[idx] = posY[idx];
                velX[idx]  = (Math.random() - 0.5) * 15;
                velY[idx]  = (Math.random() - 0.5) * 5;
            }
        }

        function addWallBlock(x, y) {
            const s = WALL_BLOCK_SIZE;
            const gx = (x / s | 0) * s;
            const gy = (y / s | 0) * s;
            for (let i = 0; i < walls.length; i++) {
                if (walls[i].x === gx && walls[i].y === gy) return;
            }
            walls.push({ x: gx, y: gy, w: s, h: s });
        }

        // ==================== Physics Step ====================
        function simulate(dt) {
            if (N === 0) return;
            const n = N;
            const dt2 = dt * dt;
            const gdt = GRAVITY_Y * dt;

            // --- 1. Gravity + save prev + advance position ---
            for (let i = 0; i < n; i++) {
                velY[i] += gdt;
                prevX[i] = posX[i];
                prevY[i] = posY[i];
                posX[i] += velX[i] * dt;
                posY[i] += velY[i] * dt;
            }

            // --- 2. Build spatial hash (ONCE per step) ---
            buildGrid();

            // --- 3. Double density relaxation ---
            // Fused: density computation + neighbor caching in ONE grid
            // traversal, then pressure displacement from cache.
            // Eliminates the second grid traversal entirely.
            for (let i = 0; i < n; i++) {
                const px = posX[i];
                const py = posY[i];
                let density = 0;
                let nearDensity = 0;
                let numNbr = 0;

                // Inline grid neighbor lookup (no closure allocation)
                const col0 = (px * INV_CELL) | 0;
                const row0 = (py * INV_CELL) | 0;
                const rMin = row0 > 0 ? row0 - 1 : 0;
                const rMax = row0 < GRID_ROWS - 1 ? row0 + 1 : row0;
                const cMin = col0 > 0 ? col0 - 1 : 0;
                const cMax = col0 < GRID_COLS - 1 ? col0 + 1 : col0;

                for (let gr = rMin; gr <= rMax; gr++) {
                    const rowOff = gr * GRID_COLS;
                    for (let gc = cMin; gc <= cMax; gc++) {
                        let j = gridHead[rowOff + gc];
                        while (j !== -1) {
                            if (j !== i) {
                                const dx = posX[j] - px;
                                const dy = posY[j] - py;
                                const r2 = dx * dx + dy * dy;
                                if (r2 < H2 && r2 > 0.0001) {
                                    // Single sqrt per pair, cached via invR
                                    const invR = 1 / Math.sqrt(r2);
                                    const r = r2 * invR;
                                    const q = r * INV_H;
                                    const w = 1 - q;
                                    const w2 = w * w;
                                    density += w2;
                                    nearDensity += w2 * w;

                                    // Cache for pressure pass
                                    if (numNbr < MAX_NBRS) {
                                        nbrIdx[numNbr] = j;
                                        nbrNx[numNbr]  = dx * invR;
                                        nbrNy[numNbr]  = dy * invR;
                                        nbrW[numNbr]   = w;
                                        numNbr++;
                                    }
                                }
                            }
                            j = gridNext[j];
                        }
                    }
                }

                // Pressure from density
                const pressure = STIFFNESS * (density - REST_DENSITY);
                const nearPressure = STIFFNESS_NEAR * nearDensity;

                // Apply displacements from cached neighbors
                let dispX = 0, dispY = 0;
                for (let k = 0; k < numNbr; k++) {
                    const w = nbrW[k];
                    const mag = (pressure * w + nearPressure * w * w) * dt2 * 0.5;
                    const fx = nbrNx[k] * mag;
                    const fy = nbrNy[k] * mag;
                    const j = nbrIdx[k];
                    posX[j] += fx;
                    posY[j] += fy;
                    dispX -= fx;
                    dispY -= fy;
                }
                posX[i] += dispX;
                posY[i] += dispY;
            }

            // --- 4. Viscosity impulses ---
            // Reuses stale grid (positions shifted by ~dt², negligible error)
            // Saves an entire buildGrid() call
            for (let i = 0; i < n; i++) {
                const px = posX[i];
                const py = posY[i];
                const col0 = (px * INV_CELL) | 0;
                const row0 = (py * INV_CELL) | 0;
                const rMin = row0 > 0 ? row0 - 1 : 0;
                const rMax = row0 < GRID_ROWS - 1 ? row0 + 1 : row0;
                const cMin = col0 > 0 ? col0 - 1 : 0;
                const cMax = col0 < GRID_COLS - 1 ? col0 + 1 : col0;

                for (let gr = rMin; gr <= rMax; gr++) {
                    const rowOff = gr * GRID_COLS;
                    for (let gc = cMin; gc <= cMax; gc++) {
                        let j = gridHead[rowOff + gc];
                        while (j !== -1) {
                            if (j > i) {
                                const dx = posX[j] - px;
                                const dy = posY[j] - py;
                                const r2 = dx * dx + dy * dy;
                                if (r2 < H2 && r2 > 0.0001) {
                                    const invR = 1 / Math.sqrt(r2);
                                    const r = r2 * invR;
                                    const w = 1 - r * INV_H;
                                    const vnx = dx * invR;
                                    const vny = dy * invR;
                                    const u = (velX[i] - velX[j]) * vnx
                                            + (velY[i] - velY[j]) * vny;
                                    if (u > 0) {
                                        const imp = dt * w * (LINEAR_VISC * u + QUAD_VISC * u * u) * 0.5;
                                        const ix = vnx * imp;
                                        const iy = vny * imp;
                                        velX[i] -= ix;
                                        velY[i] -= iy;
                                        velX[j] += ix;
                                        velY[j] += iy;
                                    }
                                }
                            }
                            j = gridNext[j];
                        }
                    }
                }
            }

            // --- 5. Boundaries + derive velocity ---
            const margin = PARTICLE_R;
            const maxX = CW - margin;
            const maxY = CH - margin;
            const maxSpd = H / dt;
            const maxSpd2 = maxSpd * maxSpd;
            const invDt = 1 / dt;
            const nWalls = walls.length;

            for (let i = 0; i < n; i++) {
                let px = posX[i];
                let py = posY[i];

                // Wall collisions (r² early-out avoids sqrt when not colliding)
                for (let wi = 0; wi < nWalls; wi++) {
                    const wl = walls[wi];
                    const cx = px < wl.x ? wl.x : (px > wl.x + wl.w ? wl.x + wl.w : px);
                    const cy = py < wl.y ? wl.y : (py > wl.y + wl.h ? wl.y + wl.h : py);
                    const dx = px - cx;
                    const dy = py - cy;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < PARTICLE_R2) {
                        if (d2 > 0.000001) {
                            const invD = 1 / Math.sqrt(d2);
                            const overlap = PARTICLE_R - d2 * invD;
                            px += dx * invD * overlap;
                            py += dy * invD * overlap;
                        } else {
                            const wcx = wl.x + wl.w * 0.5;
                            const wcy = wl.y + wl.h * 0.5;
                            if (Math.abs(px - wcx) * wl.h > Math.abs(py - wcy) * wl.w) {
                                px = px > wcx ? wl.x + wl.w + PARTICLE_R : wl.x - PARTICLE_R;
                            } else {
                                py = py > wcy ? wl.y + wl.h + PARTICLE_R : wl.y - PARTICLE_R;
                            }
                        }
                    }
                }

                // Canvas boundaries (branchless-style clamp)
                if (px < margin) px = margin;
                if (px > maxX)   px = maxX;
                if (py < margin) py = margin;
                if (py > maxY)   py = maxY;
                posX[i] = px;
                posY[i] = py;

                // Derive velocity from position delta
                let vx = (px - prevX[i]) * invDt;
                let vy = (py - prevY[i]) * invDt;

                // Clamp (r² early-out avoids sqrt when under limit)
                const s2 = vx * vx + vy * vy;
                if (s2 > maxSpd2) {
                    const scale = maxSpd / Math.sqrt(s2);
                    vx *= scale;
                    vy *= scale;
                }
                velX[i] = vx;
                velY[i] = vy;
            }
        }

        // ==================== Rendering ====================
        // Counting-sort particles by quantized color, then batch-draw
        // each color in a single beginPath+fill. Reduces fill() calls
        // from N (~3000) to NUM_COLORS (24).
        function render() {
            ctx.clearRect(0, 0, CW, CH);
            const n = N;

            // Walls
            if (walls.length > 0) {
                ctx.fillStyle = '#475569';
                for (let i = 0; i < walls.length; i++) {
                    const w = walls[i];
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                }
            }

            if (n > 0) {
                // Assign color bucket per particle
                const invRange = NUM_COLORS / 400;
                bucketCount.fill(0);
                for (let i = 0; i < n; i++) {
                    const spd = Math.sqrt(velX[i] * velX[i] + velY[i] * velY[i]);
                    let c = (spd * invRange) | 0;
                    if (c >= NUM_COLORS) c = NUM_COLORS - 1;
                    pColor[i] = c;
                    bucketCount[c]++;
                }

                // Prefix sum → bucket start indices
                bucketStart[0] = 0;
                for (let c = 1; c < NUM_COLORS; c++) {
                    bucketStart[c] = bucketStart[c - 1] + bucketCount[c - 1];
                }
                for (let c = 0; c < NUM_COLORS; c++) bucketPos[c] = bucketStart[c];

                // Place into sorted order (counting sort, O(n))
                for (let i = 0; i < n; i++) {
                    sortedIdx[bucketPos[pColor[i]]++] = i;
                }

                // Batched draw: one path per active color
                for (let c = 0; c < NUM_COLORS; c++) {
                    if (bucketCount[c] === 0) continue;
                    ctx.fillStyle = colorLUT[c];
                    ctx.beginPath();
                    const end = bucketStart[c] + bucketCount[c];
                    for (let k = bucketStart[c]; k < end; k++) {
                        const idx = sortedIdx[k];
                        ctx.moveTo(posX[idx] + PARTICLE_R, posY[idx]);
                        ctx.arc(posX[idx], posY[idx], PARTICLE_R, 0, TAU);
                    }
                    ctx.fill();
                }
            }

            // HUD
            ctx.fillStyle = '#64748b';
            ctx.font = '13px monospace';
            ctx.fillText(`particles: ${n} / ${MAX_PARTICLES}  fps: ${fpsDisplay}`, 12, CH - 12);
        }

        // ==================== FPS Counter ====================
        let fpsFrames = 0, fpsTime = 0, fpsDisplay = 0;

        // ==================== Main Loop ====================
        let lastTime = 0;

        function loop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            const elapsed = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            // FPS
            fpsFrames++;
            fpsTime += elapsed;
            if (fpsTime >= 500) {
                fpsDisplay = (fpsFrames / fpsTime * 1000 + 0.5) | 0;
                fpsFrames = 0;
                fpsTime = 0;
            }

            // Spawn while pointer held
            if (pointerDown) {
                if (shiftHeld) {
                    addWallBlock(pointerX, pointerY);
                } else {
                    spawnAt(pointerX, pointerY, SPAWN_RATE);
                }
            }

            // Fixed substep physics
            const subDt = (elapsed / 1000) / SUBSTEPS;
            if (subDt > 0 && subDt < 0.02) {
                for (let s = 0; s < SUBSTEPS; s++) {
                    simulate(subDt);
                }
            }

            render();
            requestAnimationFrame(loop);
        }

        // ==================== Input ====================
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
        }

        canvas.addEventListener('mousedown', e => {
            pointerDown = true;
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        });
        canvas.addEventListener('mousemove', e => {
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        });
        canvas.addEventListener('mouseup', () => { pointerDown = false; });
        canvas.addEventListener('mouseleave', () => { pointerDown = false; });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); pointerDown = true;
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        }, { passive: false });
        canvas.addEventListener('touchend', () => { pointerDown = false; });
        window.addEventListener('keydown', e => { if (e.key === 'Shift') shiftHeld = true; });
        window.addEventListener('keyup', e => { if (e.key === 'Shift') shiftHeld = false; });

        // ==================== Controls ====================
        document.getElementById('gravity').addEventListener('input', function() {
            GRAVITY_Y = parseFloat(this.value);
            document.getElementById('gravity-val').textContent = this.value;
        });
        document.getElementById('stiffness').addEventListener('input', function() {
            STIFFNESS = parseFloat(this.value);
            document.getElementById('stiffness-val').textContent = this.value;
        });
        document.getElementById('viscosity').addEventListener('input', function() {
            LINEAR_VISC = parseInt(this.value) / 100;
            document.getElementById('viscosity-val').textContent = this.value;
        });
        document.getElementById('spawn-rate').addEventListener('input', function() {
            SPAWN_RATE = parseInt(this.value);
            document.getElementById('spawn-rate-val').textContent = this.value;
        });
        document.getElementById('reset').addEventListener('click', () => {
            N = 0;
            walls = [];
        });

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
