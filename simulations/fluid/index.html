<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Mechanics - Physics Simulations</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        #canvas { cursor: crosshair; touch-action: none; }
        .controls { flex-wrap: wrap; }
        .info { color: #64748b; font-size: 0.8rem; text-align: center; }
        kbd { background: #334155; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.75rem; }
    </style>
</head>
<body class="sim-page">
    <header>
        <a href="../../index.html" class="back-link">&larr; Back</a>
        <h1>Fluid Mechanics</h1>
    </header>

    <div class="sim-container">
        <canvas id="canvas" width="800" height="500"></canvas>
        <p class="info">Click or drag to create water &middot; Hold <kbd>Shift</kbd>+click to place wall blocks</p>

        <div class="controls">
            <div class="control-group">
                <label>Gravity</label>
                <input type="range" id="gravity" min="0" max="60" value="25" step="1">
                <span id="gravity-val">25</span>
            </div>
            <div class="control-group">
                <label>Stiffness</label>
                <input type="range" id="stiffness" min="50" max="800" value="300" step="10">
                <span id="stiffness-val">300</span>
            </div>
            <div class="control-group">
                <label>Viscosity</label>
                <input type="range" id="viscosity" min="0" max="80" value="20">
                <span id="viscosity-val">20</span>
            </div>
            <div class="control-group">
                <label>Spawn Rate</label>
                <input type="range" id="spawn-rate" min="1" max="12" value="4">
                <span id="spawn-rate-val">4</span>
            </div>
            <button id="reset">Clear All</button>
        </div>
    </div>

    <script>
    (function () {
        // ============================================================
        // Fluid simulation using Double Density Relaxation
        // Based on Clavet, Beaudoin & Poulin (2005)
        // "Particle-based Viscoelastic Fluid Simulation"
        //
        // The algorithm works in position-space rather than
        // force-space, making it inherently stable:
        //   1. Apply gravity to velocities
        //   2. Save old positions, advance positions by velocity
        //   3. Build spatial hash of predicted positions
        //   4. For each particle, compute density and near-density
        //      from neighbors using simple polynomial kernels
        //   5. Compute pressure and near-pressure from densities
        //   6. Displace particle pairs based on pressure (relaxation)
        //   7. Apply viscosity impulses between neighbors
        //   8. Derive new velocity from position change
        //   9. Handle boundary collisions
        // ============================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const CW = canvas.width;
        const CH = canvas.height;

        // --- Tunable parameters ---
        const INTERACTION_RADIUS = 25;   // h: smoothing / neighbor radius
        const REST_DENSITY = 4.0;        // target density
        let STIFFNESS = 300;             // k: pressure stiffness
        const STIFFNESS_NEAR = 800;      // k_near: near-pressure (prevents clumping)
        let LINEAR_VISC = 0.20;          // sigma: linear viscosity
        const QUAD_VISC = 0.05;          // beta: quadratic viscosity
        let GRAVITY_Y = 25;             // gravity acceleration
        const PARTICLE_R = 4;           // visual / collision radius
        const MAX_PARTICLES = 2000;
        let SPAWN_RATE = 4;
        const SUBSTEPS = 3;             // physics substeps per frame
        const WALL_BLOCK_SIZE = 20;

        // --- State ---
        let particles = [];  // { x, y, prevX, prevY, vx, vy }
        let walls = [];      // { x, y, w, h }
        let pointerDown = false;
        let pointerX = 0, pointerY = 0;
        let shiftHeld = false;

        // ==================== Spatial Hash ====================
        const CELL = INTERACTION_RADIUS;
        const GRID_COLS = Math.ceil(CW / CELL) + 1;
        const GRID_ROWS = Math.ceil(CH / CELL) + 1;
        const gridHead = new Int32Array(GRID_COLS * GRID_ROWS);
        const gridNext = new Int32Array(MAX_PARTICLES);

        function buildGrid() {
            gridHead.fill(-1);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const col = Math.floor(p.x / CELL);
                const row = Math.floor(p.y / CELL);
                if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) continue;
                const key = row * GRID_COLS + col;
                gridNext[i] = gridHead[key];
                gridHead[key] = i;
            }
        }

        // Iterate neighbors of particle at (px, py), calling fn(j) for each
        function forEachNeighbor(px, py, fn) {
            const col = Math.floor(px / CELL);
            const row = Math.floor(py / CELL);
            for (let dr = -1; dr <= 1; dr++) {
                const r = row + dr;
                if (r < 0 || r >= GRID_ROWS) continue;
                for (let dc = -1; dc <= 1; dc++) {
                    const c = col + dc;
                    if (c < 0 || c >= GRID_COLS) continue;
                    let j = gridHead[r * GRID_COLS + c];
                    while (j !== -1) {
                        fn(j);
                        j = gridNext[j];
                    }
                }
            }
        }

        // ==================== Particle Spawning ====================
        function spawnAt(x, y, count) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= MAX_PARTICLES) return;
                const px = x + (Math.random() - 0.5) * INTERACTION_RADIUS * 0.6;
                const py = y + (Math.random() - 0.5) * INTERACTION_RADIUS * 0.6;
                particles.push({
                    x: px, y: py,
                    prevX: px, prevY: py,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 5
                });
            }
        }

        function addWallBlock(x, y) {
            const s = WALL_BLOCK_SIZE;
            const gx = Math.floor(x / s) * s;
            const gy = Math.floor(y / s) * s;
            for (const w of walls) {
                if (w.x === gx && w.y === gy) return;
            }
            walls.push({ x: gx, y: gy, w: s, h: s });
        }

        // ==================== Physics Step ====================
        function simulate(dt) {
            const n = particles.length;
            if (n === 0) return;
            const h = INTERACTION_RADIUS;
            const invH = 1 / h;

            // --- 1. Apply gravity & save previous positions ---
            for (let i = 0; i < n; i++) {
                const p = particles[i];
                p.vy += GRAVITY_Y * dt;
                p.prevX = p.x;
                p.prevY = p.y;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
            }

            // --- 2. Build spatial hash ---
            buildGrid();

            // --- 3. Double density relaxation ---
            for (let i = 0; i < n; i++) {
                const pi = particles[i];
                let density = 0;
                let nearDensity = 0;

                // Compute density from neighbors
                forEachNeighbor(pi.x, pi.y, function(j) {
                    if (j === i) return;
                    const dx = particles[j].x - pi.x;
                    const dy = particles[j].y - pi.y;
                    const r2 = dx * dx + dy * dy;
                    if (r2 >= h * h || r2 < 0.0001) return;
                    const r = Math.sqrt(r2);
                    const q = r * invH;         // normalized distance [0, 1]
                    const w = 1 - q;             // linear kernel
                    density += w * w;            // (1-q)^2
                    nearDensity += w * w * w;    // (1-q)^3
                });

                // Compute pressure from density
                const pressure = STIFFNESS * (density - REST_DENSITY);
                const nearPressure = STIFFNESS_NEAR * nearDensity;

                // Apply displacement to neighbors
                let displaceX = 0, displaceY = 0;

                forEachNeighbor(pi.x, pi.y, function(j) {
                    if (j === i) return;
                    const pj = particles[j];
                    const dx = pj.x - pi.x;
                    const dy = pj.y - pi.y;
                    const r2 = dx * dx + dy * dy;
                    if (r2 >= h * h || r2 < 0.0001) return;
                    const r = Math.sqrt(r2);
                    const q = r * invH;
                    const w = 1 - q;

                    // Magnitude of displacement
                    const mag = (pressure * w + nearPressure * w * w) * dt * dt;

                    // Direction: along the line connecting i and j
                    const fx = (dx / r) * mag * 0.5;
                    const fy = (dy / r) * mag * 0.5;

                    // Push neighbor j away
                    pj.x += fx;
                    pj.y += fy;

                    // Accumulate opposite displacement for i
                    displaceX -= fx;
                    displaceY -= fy;
                });

                pi.x += displaceX;
                pi.y += displaceY;
            }

            // --- 4. Viscosity impulses ---
            buildGrid(); // rebuild after relaxation
            for (let i = 0; i < n; i++) {
                const pi = particles[i];
                forEachNeighbor(pi.x, pi.y, function(j) {
                    if (j <= i) return;
                    const pj = particles[j];
                    const dx = pj.x - pi.x;
                    const dy = pj.y - pi.y;
                    const r2 = dx * dx + dy * dy;
                    if (r2 >= h * h || r2 < 0.0001) return;
                    const r = Math.sqrt(r2);
                    const q = r * invH;
                    const w = 1 - q;

                    // Inward velocity
                    const vnx = dx / r;
                    const vny = dy / r;
                    const relVx = pi.vx - pj.vx;
                    const relVy = pi.vy - pj.vy;
                    const u = relVx * vnx + relVy * vny; // inward speed

                    if (u > 0) {
                        const impulse = dt * w * (LINEAR_VISC * u + QUAD_VISC * u * u) * 0.5;
                        const ix = vnx * impulse;
                        const iy = vny * impulse;
                        pi.vx -= ix;
                        pi.vy -= iy;
                        pj.vx += ix;
                        pj.vy += iy;
                    }
                });
            }

            // --- 5. Derive velocity from position change + boundaries ---
            for (let i = 0; i < n; i++) {
                const p = particles[i];

                // Wall block collisions (before deriving velocity)
                for (let wi = 0; wi < walls.length; wi++) {
                    const w = walls[wi];
                    const closestX = Math.max(w.x, Math.min(p.x, w.x + w.w));
                    const closestY = Math.max(w.y, Math.min(p.y, w.y + w.h));
                    const dx = p.x - closestX;
                    const dy = p.y - closestY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARTICLE_R) {
                        if (dist > 0.001) {
                            const overlap = PARTICLE_R - dist;
                            p.x += (dx / dist) * overlap;
                            p.y += (dy / dist) * overlap;
                        } else {
                            // Inside wall — push to nearest edge
                            const cx = w.x + w.w / 2;
                            const cy = w.y + w.h / 2;
                            if (Math.abs(p.x - cx) / w.w > Math.abs(p.y - cy) / w.h) {
                                p.x = p.x > cx ? w.x + w.w + PARTICLE_R : w.x - PARTICLE_R;
                            } else {
                                p.y = p.y > cy ? w.y + w.h + PARTICLE_R : w.y - PARTICLE_R;
                            }
                        }
                    }
                }

                // Canvas boundaries
                const margin = PARTICLE_R;
                if (p.x < margin)      p.x = margin;
                if (p.x > CW - margin) p.x = CW - margin;
                if (p.y < margin)      p.y = margin;
                if (p.y > CH - margin) p.y = CH - margin;

                // Derive velocity from position delta
                p.vx = (p.x - p.prevX) / dt;
                p.vy = (p.y - p.prevY) / dt;

                // Clamp velocity to prevent instability
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const maxSpeed = h / dt;
                if (speed > maxSpeed) {
                    p.vx *= maxSpeed / speed;
                    p.vy *= maxSpeed / speed;
                }
            }
        }

        // ==================== Rendering ====================
        function render() {
            ctx.clearRect(0, 0, CW, CH);

            // Walls
            ctx.fillStyle = '#475569';
            for (const w of walls) {
                ctx.fillRect(w.x, w.y, w.w, w.h);
            }

            // Particles
            const n = particles.length;
            for (let i = 0; i < n; i++) {
                const p = particles[i];

                // Color by speed: deep blue (still) → cyan (medium) → white (fast)
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const t = Math.min(speed / 400, 1);
                let r, g, b;
                if (t < 0.5) {
                    const s = t * 2;
                    r = Math.floor(20 + s * 40);
                    g = Math.floor(80 + s * 140);
                    b = Math.floor(200 + s * 55);
                } else {
                    const s = (t - 0.5) * 2;
                    r = Math.floor(60 + s * 180);
                    g = Math.floor(220 + s * 35);
                    b = 255;
                }

                ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, PARTICLE_R, 0, Math.PI * 2);
                ctx.fill();
            }

            // HUD
            ctx.fillStyle = '#64748b';
            ctx.font = '13px monospace';
            ctx.fillText(`particles: ${n} / ${MAX_PARTICLES}`, 12, CH - 12);
        }

        // ==================== Main Loop ====================
        let lastTime = 0;

        function loop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            const elapsed = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            // Spawn while pointer held
            if (pointerDown) {
                if (shiftHeld) {
                    addWallBlock(pointerX, pointerY);
                } else {
                    spawnAt(pointerX, pointerY, SPAWN_RATE);
                }
            }

            // Fixed timestep physics with substeps
            const subDt = (elapsed / 1000) / SUBSTEPS;
            if (subDt > 0 && subDt < 0.02) {
                for (let s = 0; s < SUBSTEPS; s++) {
                    simulate(subDt);
                }
            }

            render();
            requestAnimationFrame(loop);
        }

        // ==================== Input ====================
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
        }

        canvas.addEventListener('mousedown', e => {
            pointerDown = true;
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        });
        canvas.addEventListener('mousemove', e => {
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        });
        canvas.addEventListener('mouseup', () => { pointerDown = false; });
        canvas.addEventListener('mouseleave', () => { pointerDown = false; });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); pointerDown = true;
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const p = getPos(e);
            pointerX = p.x; pointerY = p.y;
        }, { passive: false });
        canvas.addEventListener('touchend', () => { pointerDown = false; });
        window.addEventListener('keydown', e => { if (e.key === 'Shift') shiftHeld = true; });
        window.addEventListener('keyup', e => { if (e.key === 'Shift') shiftHeld = false; });

        // ==================== Controls ====================
        document.getElementById('gravity').addEventListener('input', function() {
            GRAVITY_Y = parseFloat(this.value);
            document.getElementById('gravity-val').textContent = this.value;
        });
        document.getElementById('stiffness').addEventListener('input', function() {
            STIFFNESS = parseFloat(this.value);
            document.getElementById('stiffness-val').textContent = this.value;
        });
        document.getElementById('viscosity').addEventListener('input', function() {
            LINEAR_VISC = parseInt(this.value) / 100;
            document.getElementById('viscosity-val').textContent = this.value;
        });
        document.getElementById('spawn-rate').addEventListener('input', function() {
            SPAWN_RATE = parseInt(this.value);
            document.getElementById('spawn-rate-val').textContent = this.value;
        });
        document.getElementById('reset').addEventListener('click', () => {
            particles = [];
            walls = [];
        });

        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
