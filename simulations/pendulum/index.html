<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pendulum - Physics Simulations</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="sim-page">
    <header>
        <a href="../../index.html" class="back-link">← Back</a>
        <h1>Simple Pendulum</h1>
    </header>

    <div class="sim-container">
        <canvas id="canvas" width="700" height="500"></canvas>

        <div class="controls">
            <div class="control-group">
                <label>Length</label>
                <input type="range" id="length" min="50" max="250" value="150">
                <span id="length-val">150 px</span>
            </div>
            <div class="control-group">
                <label>Gravity</label>
                <input type="range" id="gravity" min="1" max="30" value="10" step="0.5">
                <span id="gravity-val">10.0 m/s²</span>
            </div>
            <div class="control-group">
                <label>Damping</label>
                <input type="range" id="damping" min="990" max="1000" value="999">
                <span id="damping-val">0.999</span>
            </div>
            <div class="control-group">
                <label>Initial Angle</label>
                <input type="range" id="angle" min="5" max="170" value="45">
                <span id="angle-val">45°</span>
            </div>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Controls
        const lengthSlider = document.getElementById('length');
        const gravitySlider = document.getElementById('gravity');
        const dampingSlider = document.getElementById('damping');
        const angleSlider = document.getElementById('angle');
        const resetBtn = document.getElementById('reset');

        // State
        const pivotX = canvas.width / 2;
        const pivotY = 80;
        let rodLength = 150;
        let gravity = 10;
        let damping = 0.999;
        let angle = Math.PI / 4;
        let angularVelocity = 0;
        const dt = 0.05;
        const bobRadius = 18;

        // Trail
        const trail = [];
        const maxTrail = 120;

        // Dragging
        let dragging = false;

        function getBobPos() {
            return {
                x: pivotX + rodLength * Math.sin(angle),
                y: pivotY + rodLength * Math.cos(angle)
            };
        }

        function updateLabels() {
            document.getElementById('length-val').textContent = rodLength + ' px';
            document.getElementById('gravity-val').textContent = gravity.toFixed(1) + ' m/s²';
            document.getElementById('damping-val').textContent = damping.toFixed(3);
            document.getElementById('angle-val').textContent = Math.round(angleSlider.value) + '°';
        }

        function resetSim() {
            rodLength = parseInt(lengthSlider.value);
            gravity = parseFloat(gravitySlider.value);
            damping = parseInt(dampingSlider.value) / 1000;
            angle = (parseInt(angleSlider.value) * Math.PI) / 180;
            angularVelocity = 0;
            trail.length = 0;
            updateLabels();
        }

        lengthSlider.addEventListener('input', resetSim);
        gravitySlider.addEventListener('input', resetSim);
        dampingSlider.addEventListener('input', resetSim);
        angleSlider.addEventListener('input', resetSim);
        resetBtn.addEventListener('click', resetSim);

        // Mouse / touch dragging
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrag(e) {
            const pos = getPointerPos(e);
            const bob = getBobPos();
            const dist = Math.hypot(pos.x - bob.x, pos.y - bob.y);
            if (dist < bobRadius + 15) {
                dragging = true;
                e.preventDefault();
            }
        }

        function moveDrag(e) {
            if (!dragging) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            angle = Math.atan2(pos.x - pivotX, pos.y - pivotY);
            angularVelocity = 0;
            trail.length = 0;
        }

        function endDrag() {
            dragging = false;
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', moveDrag);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });
        canvas.addEventListener('touchmove', moveDrag, { passive: false });
        canvas.addEventListener('touchend', endDrag);

        function draw() {
            // Physics update
            if (!dragging) {
                const angularAccel = (-gravity / rodLength) * Math.sin(angle);
                angularVelocity += angularAccel * dt;
                angularVelocity *= damping;
                angle += angularVelocity * dt;
            }

            const bob = getBobPos();

            // Store trail
            trail.push({ x: bob.x, y: bob.y });
            if (trail.length > maxTrail) trail.shift();

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw trail
            if (trail.length > 1) {
                for (let i = 1; i < trail.length; i++) {
                    const alpha = i / trail.length;
                    ctx.strokeStyle = `rgba(59, 130, 246, ${alpha * 0.4})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                    ctx.lineTo(trail[i].x, trail[i].y);
                    ctx.stroke();
                }
            }

            // Draw rod
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY);
            ctx.lineTo(bob.x, bob.y);
            ctx.stroke();

            // Draw pivot
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.arc(pivotX, pivotY, 6, 0, Math.PI * 2);
            ctx.fill();

            // Draw bob
            const gradient = ctx.createRadialGradient(
                bob.x - 4, bob.y - 4, 2,
                bob.x, bob.y, bobRadius
            );
            gradient.addColorStop(0, '#60a5fa');
            gradient.addColorStop(1, '#2563eb');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(bob.x, bob.y, bobRadius, 0, Math.PI * 2);
            ctx.fill();

            // Info text
            ctx.fillStyle = '#64748b';
            ctx.font = '13px monospace';
            const degAngle = (angle * 180 / Math.PI).toFixed(1);
            const vel = angularVelocity.toFixed(3);
            ctx.fillText(`angle: ${degAngle}°  velocity: ${vel} rad/s`, 16, canvas.height - 16);

            // Hint
            ctx.fillStyle = '#475569';
            ctx.font = '12px sans-serif';
            ctx.fillText('Drag the bob to reposition', 16, 30);

            requestAnimationFrame(draw);
        }

        updateLabels();
        draw();
    </script>
</body>
</html>
